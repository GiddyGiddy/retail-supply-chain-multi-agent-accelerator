apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-api
  namespace: retail-supply-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supply-chain-api
  template:
    metadata:
      labels:
        app: supply-chain-api
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/supply-chain-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: AUTH_ENABLED
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supply-chain-runtime
                  key: database-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: supply-chain-runtime
                  key: kafka-bootstrap-servers
            - name: ENTRA_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: supply-chain-config
                  key: entra-tenant-id
            - name: ENTRA_API_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: supply-chain-config
                  key: entra-api-client-id
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: supply-chain-api
  namespace: retail-supply-chain
spec:
  selector:
    app: supply-chain-api
  ports:
    - port: 8000
      targetPort: 8000
