name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (commit SHA) to redeploy or roll back to. Leave empty to build the current commit."
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        env:
          PYTHONPATH: backend
        run: |
          pip install -r backend/requirements.txt
          python -m pytest backend/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP_API: ${{ vars.CONTAINER_APP_API }}
      CONTAINER_APP_FRONTEND: ${{ vars.CONTAINER_APP_FRONTEND }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      REBUILD: ${{ inputs.image_tag == '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in ACR_NAME RESOURCE_GROUP CONTAINER_APP_API CONTAINER_APP_FRONTEND; do
            if [ -z "${!name}" ]; then echo "Missing variable: $name"; exit 1; fi
          done
      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"
      - name: Build and push API
        if: env.REBUILD == 'true'
        run: |
          docker build -f backend/Dockerfile -t "$ACR_NAME.azurecr.io/supply-chain-api:${IMAGE_TAG}" .
          docker push "$ACR_NAME.azurecr.io/supply-chain-api:${IMAGE_TAG}"
      - name: Build and push frontend
        if: env.REBUILD == 'true'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH_ENABLED: "true"
          VITE_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            --build-arg VITE_AUTH_ENABLED="$VITE_AUTH_ENABLED" \
            --build-arg VITE_ENTRA_TENANT_ID="$VITE_ENTRA_TENANT_ID" \
            --build-arg VITE_ENTRA_CLIENT_ID="$VITE_ENTRA_CLIENT_ID" \
            --build-arg VITE_ENTRA_API_SCOPE="$VITE_ENTRA_API_SCOPE" \
            -t "$ACR_NAME.azurecr.io/supply-chain-frontend:${IMAGE_TAG}" frontend
          docker push "$ACR_NAME.azurecr.io/supply-chain-frontend:${IMAGE_TAG}"
      - name: Verify images exist
        run: |
          az acr repository show --name "$ACR_NAME" --image "supply-chain-api:${IMAGE_TAG}" -o none
          az acr repository show --name "$ACR_NAME" --image "supply-chain-frontend:${IMAGE_TAG}" -o none
      - name: Remember current API image
        run: |
          prev=$(az containerapp show --name "$CONTAINER_APP_API" --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "PREVIOUS_API_IMAGE=$prev" >> "$GITHUB_ENV"
      - name: Update Container Apps
        run: |
          az containerapp update --name "$CONTAINER_APP_API" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/supply-chain-api:${IMAGE_TAG}"
          az containerapp update --name "$CONTAINER_APP_FRONTEND" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/supply-chain-frontend:${IMAGE_TAG}"
      - name: Health check API
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP_API" --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for i in $(seq 1 18); do
            if curl -fsS "https://$fqdn/api/health" >/dev/null; then echo "API healthy"; exit 0; fi
            echo "Waiting for API ($i/18)..."; sleep 10
          done
          echo "API did not become healthy"; exit 1
      - name: Roll back API on failure
        if: failure() && env.PREVIOUS_API_IMAGE != ''
        run: |
          az containerapp update --name "$CONTAINER_APP_API" --resource-group "$RESOURCE_GROUP" \
            --image "$PREVIOUS_API_IMAGE"